user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" $request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=250r/s;

    # Upstream Definitions
    upstream convoza_api {
        server api:4000;
        keepalive 32;
    }

    upstream convoza_website {
        server website:3000;
        keepalive 32;
    }

    upstream convoza_dashboard {
        server dashboard:3001;
        keepalive 32;
    }

    upstream convoza_admin {
        server admin:3002;
        keepalive 32;
    }

    # Main HTTP Server
    server {
        listen 80;
        server_name convoza.emperorsmartsolutions.com convoza.io www.convoza.io app.convoza.io admin.convoza.io api.convoza.io localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health Check
        location /health {
            return 200 "CONVOZA Edge Nginx Healthy\n";
            add_header Content-Type text/plain;
        }

        # NestJS REST API
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://convoza_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Meta Webhook Ingestion (High-Burst Allowed)
        location /api/v1/webhooks/ {
            limit_req zone=webhook_limit burst=200 nodelay;
            proxy_pass http://convoza_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO Real-Time WebSockets Upgrade
        location /socket.io/ {
            proxy_pass http://convoza_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /inbox {
            proxy_pass http://convoza_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Isolated Next.js Static Assets for Admin & Dashboard on Single Domain
        location /admin-assets/ {
            rewrite ^/admin-assets(/.*)$ $1 break;
            proxy_pass http://convoza_admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /dashboard-assets/ {
            rewrite ^/dashboard-assets(/.*)$ $1 break;
            proxy_pass http://convoza_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Super Admin Portal
        location = /admin {
            proxy_pass http://convoza_admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /admin/ {
            proxy_pass http://convoza_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Customer Dashboard
        location = /dashboard {
            proxy_pass http://convoza_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /dashboard/ {
            proxy_pass http://convoza_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Public Marketing Website (Default Root)
        location / {
            proxy_pass http://convoza_website;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

